<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eff7f1">
<title>拼图挑战 · 解锁惊喜</title>
<style>
:root{--ink:#29463b;--muted:#71847a;--green:#83b99f;--green2:#e8f3eb;--line:#dce9df;--paper:#fff;--bg:#f2f8f3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 14px 40px;color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#eaf5ed 0%,#f8faf7 55%,#eef6ef 100%)}
main{max-width:760px;margin:auto}
header{text-align:center;margin:8px 0 22px}
.kicker{font-size:12px;letter-spacing:.18em;font-weight:800;color:#6c9b7d}
h1{font-size:clamp(26px,6vw,36px);margin:8px 0;color:#29463b}
.subtitle{margin:0;color:var(--muted);line-height:1.7}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 12px 35px #527b5e12}
.intro h2,.done h2{margin:8px 0 10px}
.intro p{color:var(--muted);line-height:1.8}
.pill{display:inline-block;border-radius:999px;background:var(--green2);color:#578366;padding:6px 11px;font-size:12px;font-weight:750}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:750}
.primary{background:var(--green);color:#173b2a}
.secondary{background:#edf4ee;color:#52705d;border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-bottom:10px}
.track{height:7px;background:#e9f0ea;border-radius:20px;overflow:hidden;margin-bottom:16px}
.track>div{height:100%;width:0;background:linear-gradient(90deg,#83b99f,#b2d5b8);transition:width .2s}
.playhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.playhead strong{font-size:16px}
.board{width:min(100%,560px);margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:7px;background:#e7efe8;border:1px solid #dce8de;border-radius:18px;touch-action:manipulation}

<header>
 <div class="kicker">A LITTLE PUZZLE CHALLENGE</div>
 <h1>拼图挑战</h1>
 <p class="subtitle">把被打乱的图片拼回原样，解锁一份小惊喜。</p>
</header>
<section id="intro" class="panel intro">
 <span class="pill">3 × 3 滑块拼图</span>
 <h2>准备好了吗？</h2>

<script>
const N=3, TOTAL=N*N;
let cells=[], moves=0, started=false;
const $=id=>document.getElementById(id);
function neighbors(i){
 const r=Math.floor(i/N),c=i%N,a=[];
 if(r>0)a.push(i-N);if(r<N-1)a.push(i+N);if(c>0)a.push(i-1);if(c<N-1)a.push(i+1);
 return a;
}
function shuffleSolvable(){
 cells=Array.from({length:TOTAL},(_,i)=>i);
 let blank=TOTAL-1,prev=-1;
 // Random legal moves from the solved state guarantees a solvable board.
 for(let k=0;k<180;k++){
  let opts=neighbors(blank).filter(x=>x!==prev);
  if(!opts.length)opts=neighbors(blank);
  const next=opts[Math.floor(Math.random()*opts.length)];
  [cells[blank],cells[next]]=[cells[next],cells[blank]];
  prev=blank;blank=next;
 }
 if(isSolved())shuffleSolvable();
}
function isSolved(){return cells.every((v,i)=>v===i)}
function startGame(){
 $("intro").classList.add("hidden");$("done").classList.add("hidden");$("game").classList.remove("hidden");
 shuffleSolvable();moves=0;started=true;render();
}
function render(){
 const board=$("board");board.innerHTML="";
 cells.forEach((piece,pos)=>{
  const b=document.createElement("button");
  b.className="tile"+(piece===TOTAL-1?" empty":"");
  b.setAttribute("aria-label",piece===TOTAL-1?"空白格":`图片块 ${piece+1}`);
  if(piece!==TOTAL-1){
   const row=Math.floor(piece/N),col=piece%N;
   b.style.backgroundPosition=`${col*50}% ${row*50}%`;
   const num=document.createElement("span");num.className="num";num.textContent=piece+1;b.appendChild(num);
   b.addEventListener("click",()=>moveTile(pos));
  }else{
   b.disabled=true;
  }
  board.appendChild(b);
 });
 $("moves").textContent=`移动次数：${moves}`;
 const correct=cells.reduce((s,v,i)=>s+(v===i?1:0),0);
 $("progress").style.width=`${correct/TOTAL*100}%`;
}
function moveTile(pos){
 const blank=cells.indexOf(TOTAL-1);
 if(!neighbors(blank).includes(pos))return;
 [cells[blank],cells[pos]]=[cells[pos],cells[blank]];
 moves++;render();
 if(isSolved())finish();
}
function finish(){
 $("game").classList.add("hidden");$("done").classList.remove("hidden");
 $("stats").textContent=`你用了 ${moves} 步成功还原图片。奖励已解锁！`;
 window.scrollTo({top:0,behavior:"smooth"});
}
function showPreview(){$("previewModal").classList.remove("hidden")}
function hidePreview(){$("previewModal").classList.add("hidden")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")hidePreview()});
</script>
